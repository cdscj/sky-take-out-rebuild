# 数据源配置
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      # 主库数据源
      master:
        url: jdbc:mysql://${FORUM_DB_HOST:127.0.0.1}:${FORUM_DB_PORT:3306}/${FORUM_DB_NAME:forum_20240830}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&cachePrepStmts=true&useServerPrepStmts=true&rewriteBatchedStatements=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
        username: ${FORUM_DB_USERNAME:root}
        password: ${FORUM_DB_PASSWORD}
      # 从库数据源
      slave:
        # 从数据源开关/默认关闭
        enabled: false
        url:
        username:
        password:
      # 初始连接数
      initialSize: 10
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: forum
        login-password: ${FORUM_DRUID_PASSWORD}
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  # redis 配置
  redis:
    # 地址
    host: ${FORUM_REDIS_HOST:192.168.150.101}
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 1
    # 密码
    password: ${FORUM_REDIS_PASSWORD}
    # 连接超时时间
    timeout: 600s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

#阿里云短信配置
aliyun:
  accessKeyID: ${FORUM_ALIYUN_ACCESS_KEY}
  accessKeySecret: ${FORUM_ALIYUN_ACCESS_SECRET}
  signName: ${FORUM_ALIYUN_SIGN_NAME:cj-cds}
  templateCode: ${FORUM_ALIYUN_SMS_TEMPLATE:SMS_xxxxxxxxxxx}

#邮箱相关配置（敏感信息通过环境变量注入）
email:
  code: ${FORUM_EMAIL_CODE}
  passWord: ${FORUM_EMAIL_PASSWORD}
  host: ${FORUM_EMAIL_HOST:smtp.qq.com}
  port: ${FORUM_EMAIL_PORT:465}

file:
  #web/移动端上传文件保存目录
  uploadUrl: /home/forum/upload/avatar
  #Web/移动端上传文件外网访问目录
  showUrl: http://www.xxx.com/forum/upload/avatar                                                                                     forum/avatar