# 项目相关配置
forum:
  # 名称
  name: WenxinForum
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2023
  # 实例演示开关
  demoEnabled: true
  # 后台管理系统文件上传保存路径 示例（ Windows配置F:/server/upload/path，Linux配置 /home/forum//upload/path）
  profile: /home/forum/upload/path
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8082
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
    connection-timeout: 100m

# 日志配置
logging:
  level:
    cn.net.wenxin: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: ${FORUM_JPA_DDL_AUTO:none}
    show-sql: ${FORUM_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  # WebSocket配置
  websocket:
    endpoint: /ws/message
    allowed-origins: "*"
    heartbeat-interval: 30000  # 心跳间隔30秒
  message:
    recall-time-limit: 120  # 撤回时间限制（秒）
    max-message-size: 10240  # 最大消息长度
    offline-message-ttl: 2592000  # 离线消息保存时间（秒）
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size:  10MB
      # 设置总上传的文件大小
      max-request-size:  20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（生产环境必须通过环境变量覆盖）
  secret: ${FORUM_TOKEN_SECRET:changeme}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: cn.net.wenxin.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
# 在文件最后添加
permit-all:
  urls:
    - /cas/login
    - /dev-api/cas/login
    - /cas/**
    - /dev-api/cas/**
    - /forum/**
    - /register/**
    - /test/**
    - /swagger-ui.html
    - /swagger-resources/**
    - /webjars/**
    - /v2/api-docs
    - /druid/**
# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类列表
  # 生产环境需要关闭
  production: false
  wechat:
    appid: ${FORUM_WECHAT_APPID}
    secret: ${FORUM_WECHAT_SECRET}
    mchid: ${FORUM_WECHAT_MCHID}
    mchSerialNo: ${FORUM_WECHAT_MCH_SERIAL_NO}
    apiV3Key: ${FORUM_WECHAT_API_V3_KEY}
    notifyUrl: ${FORUM_WECHAT_NOTIFY_URL}
    refundNotifyUrl: ${FORUM_WECHAT_REFUND_NOTIFY_URL}
