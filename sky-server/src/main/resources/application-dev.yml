sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${SKY_DB_HOST:localhost}
    port: ${SKY_DB_PORT:3306}
    database: ${SKY_DB_NAME:sky_take_out}
    username: ${SKY_DB_USERNAME:root}
    password: ${SKY_DB_PASSWORD}
  alioss:
    endpoint: ${SKY_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${SKY_OSS_KEY_ID}
    access-key-secret: ${SKY_OSS_KEY_SECRET}
    bucket-name: ${SKY_OSS_BUCKET:skyproject2}
  redis:
    host: ${SKY_REDIS_HOST:192.168.150.101}
    port: ${SKY_REDIS_PORT:6379}
    password: ${SKY_REDIS_PASSWORD}
    database: ${SKY_REDIS_DB:10}
  wechat:
    appid: ${SKY_WECHAT_APPID}
    secret: ${SKY_WECHAT_SECRET}
    mchid: ${SKY_WECHAT_MCHID}
    mchSerialNo: ${SKY_WECHAT_MCH_SERIAL_NO}
    apiV3Key: ${SKY_WECHAT_API_V3_KEY}
    notifyUrl: ${SKY_WECHAT_NOTIFY_URL}
    refundNotifyUrl: ${SKY_WECHAT_REFUND_NOTIFY_URL}
  shop:
    address: ${SKY_SHOP_ADDRESS:广东省江门市蓬江区白沙街道东成村22号五邑大学}
  baidu:
    ak: ${SKY_BAIDU_AK}
  map:
    gaode-api-key: ${SKY_GAODE_API_KEY}
    baidu-ak: ${SKY_BAIDU_AK}
